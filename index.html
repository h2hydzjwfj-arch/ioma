<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Логистический калькулятор</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="login" class="login"><div class="login-card"><h1>Логистический кабинет</h1><p>Доступ только для авторизованных пользователей.</p><form id="loginForm"><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button>Войти</button><div id="loginError" class="error"></div></form></div></div>
<div id="app" hidden><header><div><h1>Калькулятор доставки: Китай → Россия</h1><div class="muted">Безопасный кабинет • <span id="agentCount"></span> контактов</div></div><button id="logout" class="secondary">Выйти</button></header>
<main><section class="panel"><h2>Параметры груза</h2><div class="grid"><label>Откуда<input id="origin" value="Qingdao"></label><label>Куда<input id="dest" value="Moscow"></label><label>Вес одного места, кг<input id="weight" type="number" min="0" step="0.01" value="280"></label><label>Количество мест<input id="places" type="number" min="1" step="1" value="1"></label><label>Длина, мм<input id="length" type="number" min="1" value="1950"></label><label>Ширина, мм<input id="width" type="number" min="1" value="1400"></label><label>Высота, мм<input id="height" type="number" min="1" value="1850"></label><label>Условия поставки<select id="terms"><option>EXW</option><option>FOB</option><option>FCA</option></select></label></div><button id="calc">Рассчитать объём</button><div id="result" class="result" hidden></div></section>
<section class="panel"><div class="tabs"><button class="tab active" data-tab="agents">Агенты</button><button class="tab" data-tab="rates">Ставки</button></div><div id="agentsTab"><div class="toolbar"><input id="search" placeholder="Поиск по компании, контакту, почте..."><select id="transport"><option value="">Все виды транспорта</option></select></div><div id="agents" class="agents"></div></div><div id="ratesTab" hidden><label>Агент<select id="rateAgent"></select></label><label>Текст ставки<textarea id="rateText" maxlength="3000" placeholder="Например: Море + ЖД, 4200$ за 20ft..."></textarea></label><div class="row"><button id="saveRate">Сохранить ставку</button><button id="deleteRate" class="danger">Удалить</button></div><div id="rateStatus" class="muted"></div></div></section></main></div><script src="/app.js" defer></script></body></html>
